name: Build RAJON J.A.R.V.I.S. APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      # Android refuses to update an app signed with a different certificate.
      # GitHub-hosted runners start with no debug keystore, so without this cache
      # every run produces a new signing identity and users must uninstall first.
      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Run Action Parser Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/logbranch"
          cp build.log "$RUNNER_TEMP/logbranch/ci-build-error.log"
          cd "$RUNNER_TEMP/logbranch"
          git init -q
          git checkout -q -b ci-logs
          git add ci-build-error.log
          git -c user.name="jarvis-ci" -c user.email="jarvis-ci@users.noreply.github.com" \
            commit -q -m "ci: build error log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs:ci-logs

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
